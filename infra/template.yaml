AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Smoulder - landfill fire record, Smoke Days and downwind alerts (ap-south-1)

Parameters:
  FirmsKeyParam:
    Type: String
    Default: /smoulder/firms_map_key
    Description: SSM SecureString parameter holding the NASA FIRMS MAP_KEY (create it before deploying)
  BedrockModelId:
    Type: String
    Default: apac.anthropic.claude-sonnet-4-20250514-v1:0
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Amplify app origin for CORS, e.g. https://main.d123.amplifyapp.com (set after the first Amplify deploy)
  SiteBaseUrl:
    Type: String
    Default: ""
    Description: Public web URL used in alert emails (Amplify URL)
  BudgetEmail:
    Type: String
    Default: ""
    Description: Email for the AWS Budgets alert (leave empty to skip the budget)
  WatchRate:
    Type: String
    Default: rate(30 minutes)

Conditions:
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, ""]]

Globals:
  Function:
    Architectures: [x86_64]
    Environment:
      Variables:
        SMOULDER_BUCKET: !Ref DataBucket
        SMOULDER_CACHE: /tmp/smoulder
        FIRMS_MAP_KEY_PARAM: !Ref FirmsKeyParam
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        ALERT_TOPIC_ARN: !Ref AlertTopic
        SITE_BASE_URL: !Ref SiteBaseUrl
        TABLE_SITES: !Ref SitesTable
        TABLE_DETECTIONS: !Ref DetectionsTable
        TABLE_FIRE_DAYS: !Ref FireDaysTable
        TABLE_EPISODES: !Ref EpisodesTable
        TABLE_WIND: !Ref WindTable
        TABLE_BURN_OBS: !Ref BurnObsTable
        TABLE_CONTEXT: !Ref ContextTable
        TABLE_SUBSCRIBERS: !Ref SubscribersTable
        TABLE_ALERTS: !Ref AlertsTable
        TABLE_BRIEFS: !Ref BriefsTable
        TABLE_RUNS: !Ref RunsTable

Resources:
  # ---------------- storage ----------------
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      LifecycleConfiguration:
        Rules: [{ Id: expire-old-snapshots, Status: Enabled, Prefix: public/backfill-, ExpirationInDays: 90 }]

  SitesTable:
    Type: AWS::DynamoDB::Table
    Properties: { BillingMode: PAY_PER_REQUEST, AttributeDefinitions: [{ AttributeName: site_id, AttributeType: S }], KeySchema: [{ AttributeName: site_id, KeyType: HASH }] }
  DetectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: site_id, AttributeType: S }, { AttributeName: sk, AttributeType: S }, { AttributeName: date_ist, AttributeType: S }]
      KeySchema: [{ AttributeName: site_id, KeyType: HASH }, { AttributeName: sk, KeyType: RANGE }]
      GlobalSecondaryIndexes: [{ IndexName: by_date, KeySchema: [{ AttributeName: date_ist, KeyType: HASH }], Projection: { ProjectionType: ALL } }]
  FireDaysTable:
    Type: AWS::DynamoDB::Table
    Properties: { BillingMode: PAY_PER_REQUEST, AttributeDefinitions: [{ AttributeName: site_id, AttributeType: S }, { AttributeName: date_ist, AttributeType: S }], KeySchema: [{ AttributeName: site_id, KeyType: HASH }, { AttributeName: date_ist, KeyType: RANGE }] }
  EpisodesTable:
    Type: AWS::DynamoDB::Table
    Properties: { BillingMode: PAY_PER_REQUEST, AttributeDefinitions: [{ AttributeName: site_id, AttributeType: S }, { AttributeName: start_date, AttributeType: S }], KeySchema: [{ AttributeName: site_id, KeyType: HASH }, { AttributeName: start_date, KeyType: RANGE }] }
  WindTable:
    Type: AWS::DynamoDB::Table
    Properties: { BillingMode: PAY_PER_REQUEST, AttributeDefinitions: [{ AttributeName: site_id, AttributeType: S }, { AttributeName: ts_ist, AttributeType: S }], KeySchema: [{ AttributeName: site_id, KeyType: HASH }, { AttributeName: ts_ist, KeyType: RANGE }] }
  BurnObsTable:
    Type: AWS::DynamoDB::Table
    Properties: { BillingMode: PAY_PER_REQUEST, AttributeDefinitions: [{ AttributeName: site_id, AttributeType: S }, { AttributeName: sk, AttributeType: S }], KeySchema: [{ AttributeName: site_id, KeyType: HASH }, { AttributeName: sk, KeyType: RANGE }] }
  ContextTable:
    Type: AWS::DynamoDB::Table
    Properties: { BillingMode: PAY_PER_REQUEST, AttributeDefinitions: [{ AttributeName: site_id, AttributeType: S }], KeySchema: [{ AttributeName: site_id, KeyType: HASH }] }
  SubscribersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: sub_id, AttributeType: S }, { AttributeName: email_hash, AttributeType: S }]
      KeySchema: [{ AttributeName: sub_id, KeyType: HASH }]
      GlobalSecondaryIndexes: [{ IndexName: by_email, KeySchema: [{ AttributeName: email_hash, KeyType: HASH }], Projection: { ProjectionType: ALL } }]
  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties: { BillingMode: PAY_PER_REQUEST, AttributeDefinitions: [{ AttributeName: sub_id, AttributeType: S }, { AttributeName: det_id, AttributeType: S }], KeySchema: [{ AttributeName: sub_id, KeyType: HASH }, { AttributeName: det_id, KeyType: RANGE }] }
  BriefsTable:
    Type: AWS::DynamoDB::Table
    Properties: { BillingMode: PAY_PER_REQUEST, AttributeDefinitions: [{ AttributeName: site_id, AttributeType: S }, { AttributeName: sk, AttributeType: S }], KeySchema: [{ AttributeName: site_id, KeyType: HASH }, { AttributeName: sk, KeyType: RANGE }] }
  RunsTable:
    Type: AWS::DynamoDB::Table
    Properties: { BillingMode: PAY_PER_REQUEST, AttributeDefinitions: [{ AttributeName: run_id, AttributeType: S }], KeySchema: [{ AttributeName: run_id, KeyType: HASH }] }

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties: { DisplayName: Smoulder }
  OpsTopic:
    Type: AWS::SNS::Topic
    Properties: { DisplayName: Smoulder ops alarms }

  # ---------------- compute ----------------
  PipelineFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig: { Command: ["pipeline.aws.tasks.handler"] }
      MemorySize: 2048
      Timeout: 900
      EphemeralStorage: { Size: 2048 }
      Policies:
        - S3CrudPolicy: { BucketName: !Ref DataBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref SitesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref DetectionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref FireDaysTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EpisodesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WindTable }
        - DynamoDBCrudPolicy: { TableName: !Ref BurnObsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ContextTable }
        - DynamoDBReadPolicy: { TableName: !Ref SubscribersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AlertsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref BriefsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref RunsTable }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertTopic.TopicName }
        - Statement:
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${FirmsKeyParam}
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:Converse]
              Resource: ["arn:aws:bedrock:*::foundation-model/*", !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"]
    Metadata:
      Dockerfile: infra/Dockerfile
      DockerContext: ..
      DockerTag: py312-v1

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig: { Command: ["api.app.handler"] }
      MemorySize: 1024
      Timeout: 29
      Policies:
        - S3ReadPolicy: { BucketName: !Ref DataBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref SubscribersTable }
        - DynamoDBReadPolicy: { TableName: !Ref AlertsTable }
        - DynamoDBReadPolicy: { TableName: !Ref RunsTable }
        - Statement:
            - Effect: Allow
              Action: [sns:Subscribe, sns:Unsubscribe]
              Resource: !Ref AlertTopic
            - Effect: Allow
              Action: [geo-places:Geocode]
              Resource: !Sub arn:aws:geo-places:${AWS::Region}::provider/default
      Events:
        Meta: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/meta", Method: GET } }
        Snapshot: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/snapshot", Method: GET } }
        Sites: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/sites", Method: GET } }
        Site: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/sites/{id}", Method: GET } }
        SiteDets: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/sites/{id}/detections", Method: GET } }
        SiteRecord: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/sites/{id}/record", Method: GET } }
        SiteBrief: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/sites/{id}/brief", Method: GET } }
        SmokeDays: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/smoke-days", Method: GET } }
        Live: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/live", Method: GET } }
        Imagery: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/imagery/{key+}", Method: GET } }
        Runs: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/runs/latest", Method: GET } }
        Subscribe: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/subscribe", Method: POST } }
        Unsubscribe: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/unsubscribe", Method: POST } }
    Metadata:
      Dockerfile: infra/Dockerfile
      DockerContext: ..
      DockerTag: py312-v1

  # Replay is admin-only: IAM-authorised route on its own function role
  ReplayFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig: { Command: ["api.app.handler"] }
      MemorySize: 1024
      Timeout: 29
      Policies:
        - S3CrudPolicy: { BucketName: !Ref DataBucket }
        - DynamoDBReadPolicy: { TableName: !Ref SubscribersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AlertsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref RunsTable }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertTopic.TopicName }
      Events:
        Replay: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/admin/replay", Method: POST, Auth: { Authorizer: AWS_IAM } } }
    Metadata:
      Dockerfile: infra/Dockerfile
      DockerContext: ..
      DockerTag: py312-v1

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, POST]
        AllowHeaders: [content-type]
        MaxAge: 600
      DefaultRouteSettings: { ThrottlingBurstLimit: 20, ThrottlingRateLimit: 10 }
      Auth: { EnableIamAuthorizer: true }   # lets /admin/replay use AWS_IAM; public routes stay open

  # ---------------- orchestration ----------------
  BackfillStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: smoulder-backfill
      Policies: [{ LambdaInvokePolicy: { FunctionName: !Ref PipelineFunction } }]
      DefinitionSubstitutions: { Fn: !GetAtt PipelineFunction.Arn }
      Definition:
        Comment: Rebuild the fire record from open data
        StartAt: LoadSites
        States:
          LoadSites:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters: { FunctionName: "${Fn}", Payload: { task: load_sites, "run_id.$": "$$.Execution.Name" } }
            ResultSelector: { "run_id.$": "$.Payload.run_id", "cities.$": "$.Payload.cities", "sites.$": "$.Payload.sites" }
            ResultPath: $.ctx
            Retry: [{ ErrorEquals: [Lambda.ServiceException, Lambda.TooManyRequestsException, Lambda.SdkClientException, States.Timeout], IntervalSeconds: 5, BackoffRate: 2, MaxAttempts: 3 }]
            Catch: [{ ErrorEquals: [States.ALL], ResultPath: $.error, Next: Failed }]
            Next: FetchCities
          FetchCities:
            Type: Map
            ItemsPath: $.ctx.cities
            MaxConcurrency: 1   # FIRMS transaction limit: one city at a time
            ItemSelector: { task: fetch_firms, "city.$": "$$.Map.Item.Value", "run_id.$": "$.ctx.run_id" }
            ItemProcessor:
              ProcessorConfig: { Mode: INLINE }
              StartAt: FetchFirmsWindows
              States:
                FetchFirmsWindows:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters: { FunctionName: "${Fn}", "Payload.$": "$" }
                  OutputPath: $.Payload
                  Retry: [{ ErrorEquals: [Lambda.ServiceException, Lambda.TooManyRequestsException, Lambda.SdkClientException, States.Timeout], IntervalSeconds: 5, BackoffRate: 2, MaxAttempts: 3 }]
                  End: true
            ResultPath: null
            Catch: [{ ErrorEquals: [States.ALL], ResultPath: $.error, Next: Failed }]
            Next: Attribute
          Attribute:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters: { FunctionName: "${Fn}", Payload: { task: attribute, "run_id.$": "$.ctx.run_id" } }
            ResultPath: null
            Retry: [{ ErrorEquals: [Lambda.ServiceException, Lambda.TooManyRequestsException, Lambda.SdkClientException, States.Timeout], IntervalSeconds: 5, BackoffRate: 2, MaxAttempts: 3 }]
            Catch: [{ ErrorEquals: [States.ALL], ResultPath: $.error, Next: Failed }]
            Next: PerSite
          PerSite:
            Type: Map
            ItemsPath: $.ctx.sites
            MaxConcurrency: 3
            ItemSelector: { task: site_stage, "site_id.$": "$$.Map.Item.Value", "run_id.$": "$.ctx.run_id" }
            ItemProcessor:
              ProcessorConfig: { Mode: INLINE }
              StartAt: SiteStage
              States:
                SiteStage:
                  Comment: FetchWind -> FindScenes -> MeasureBurn -> FetchContext
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters: { FunctionName: "${Fn}", "Payload.$": "$" }
                  OutputPath: $.Payload
                  Retry: [{ ErrorEquals: [Lambda.ServiceException, Lambda.TooManyRequestsException, Lambda.SdkClientException, States.Timeout], IntervalSeconds: 5, BackoffRate: 2, MaxAttempts: 3 }]
                  End: true
            ResultPath: null
            Catch: [{ ErrorEquals: [States.ALL], ResultPath: $.error, Next: Failed }]
            Next: Validate
          Validate:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters: { FunctionName: "${Fn}", Payload: { task: validate, "run_id.$": "$.ctx.run_id" } }
            ResultPath: null
            Retry: [{ ErrorEquals: [Lambda.ServiceException, Lambda.TooManyRequestsException, Lambda.SdkClientException, States.Timeout], IntervalSeconds: 5, BackoffRate: 2, MaxAttempts: 3 }]
            Catch: [{ ErrorEquals: [States.ALL], ResultPath: $.error, Next: Failed }]
            Next: GenerateBriefs
          GenerateBriefs:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters: { FunctionName: "${Fn}", Payload: { task: generate_briefs, "run_id.$": "$.ctx.run_id" } }
            ResultPath: null
            Retry: [{ ErrorEquals: [Lambda.ServiceException, Lambda.TooManyRequestsException, Lambda.SdkClientException, States.Timeout], IntervalSeconds: 5, BackoffRate: 2, MaxAttempts: 3 }]
            Catch: [{ ErrorEquals: [States.ALL], ResultPath: $.error, Next: Failed }]
            Next: PublishSnapshot
          PublishSnapshot:
            Comment: ComputeDownwind, Rank, snapshot to S3, records to DynamoDB
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters: { FunctionName: "${Fn}", Payload: { task: publish, "run_id.$": "$.ctx.run_id" } }
            OutputPath: $.Payload
            Retry: [{ ErrorEquals: [Lambda.ServiceException, Lambda.TooManyRequestsException, Lambda.SdkClientException, States.Timeout], IntervalSeconds: 5, BackoffRate: 2, MaxAttempts: 3 }]
            Catch: [{ ErrorEquals: [States.ALL], ResultPath: $.error, Next: Failed }]
            End: true
          Failed: { Type: Fail, Error: BackfillFailed }

  WatchStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: smoulder-watch
      Policies: [{ LambdaInvokePolicy: { FunctionName: !Ref PipelineFunction } }]
      DefinitionSubstitutions: { Fn: !GetAtt PipelineFunction.Arn }
      Definition:
        Comment: Poll FIRMS NRT, alert downwind subscribers
        StartAt: PollNRT
        States:
          PollNRT:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters: { FunctionName: "${Fn}", Payload: { task: poll_nrt, "run_id.$": "$$.Execution.Name" } }
            OutputPath: $.Payload
            Retry: [{ ErrorEquals: [Lambda.ServiceException, Lambda.TooManyRequestsException, Lambda.SdkClientException, States.Timeout], IntervalSeconds: 5, BackoffRate: 2, MaxAttempts: 3 }]
            Catch: [{ ErrorEquals: [States.ALL], ResultPath: $.error, Next: Failed }]
            Next: Dedupe
          Dedupe:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters: { FunctionName: "${Fn}", Payload: { task: dedupe, "run_id.$": "$.run_id", "detections.$": "$.detections" } }
            OutputPath: $.Payload
            Retry: [{ ErrorEquals: [Lambda.ServiceException, Lambda.TooManyRequestsException, Lambda.SdkClientException, States.Timeout], IntervalSeconds: 5, BackoffRate: 2, MaxAttempts: 3 }]
            Catch: [{ ErrorEquals: [States.ALL], ResultPath: $.error, Next: Failed }]
            Next: AnyNew
          AnyNew:
            Type: Choice
            Choices: [{ Variable: $.has_new, BooleanEquals: true, Next: AlertEachDetection }]
            Default: UpdateLiveFeed
          AlertEachDetection:
            Comment: FetchForecast -> DownwindCheck per subscriber -> NotifySNS
            Type: Map
            ItemsPath: $.new
            MaxConcurrency: 2
            ItemSelector: { task: alert, "detection.$": "$$.Map.Item.Value", "run_id.$": "$.run_id" }
            ItemProcessor:
              ProcessorConfig: { Mode: INLINE }
              StartAt: AlertSubscribers
              States:
                AlertSubscribers:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters: { FunctionName: "${Fn}", "Payload.$": "$" }
                  OutputPath: $.Payload
                  Retry: [{ ErrorEquals: [Lambda.ServiceException, Lambda.TooManyRequestsException, Lambda.SdkClientException, States.Timeout], IntervalSeconds: 5, BackoffRate: 2, MaxAttempts: 3 }]
                  End: true
            ResultPath: null
            Catch: [{ ErrorEquals: [States.ALL], ResultPath: $.error, Next: Failed }]
            Next: UpdateLiveFeed
          UpdateLiveFeed:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters: { FunctionName: "${Fn}", Payload: { task: update_live, "run_id.$": "$.run_id", "all.$": "$.all" } }
            OutputPath: $.Payload
            Retry: [{ ErrorEquals: [Lambda.ServiceException, Lambda.TooManyRequestsException, Lambda.SdkClientException, States.Timeout], IntervalSeconds: 5, BackoffRate: 2, MaxAttempts: 3 }]
            Catch: [{ ErrorEquals: [States.ALL], ResultPath: $.error, Next: Failed }]
            End: true
          Failed: { Type: Fail, Error: WatchFailed }

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: scheduler.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: start-watch
          PolicyDocument:
            Version: "2012-10-17"
            Statement: [{ Effect: Allow, Action: states:StartExecution, Resource: !Ref WatchStateMachine }]

  WatchSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: smoulder-watch-every-30-min
      ScheduleExpression: !Ref WatchRate
      FlexibleTimeWindow: { Mode: "OFF" }
      Target: { Arn: !Ref WatchStateMachine, RoleArn: !GetAtt SchedulerRole.Arn, Input: "{}" }

  # ---------------- observability and cost ----------------
  BackfillFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Smoulder backfill execution failed
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions: [{ Name: StateMachineArn, Value: !Ref BackfillStateMachine }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]
  WatchFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Smoulder watch execution failed
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions: [{ Name: StateMachineArn, Value: !Ref WatchStateMachine }]
      Statistic: Sum
      Period: 1800
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]
  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Smoulder API function errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: smoulder
      DashboardBody: !Sub |
        {"widgets":[
          {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"Runs","region":"${AWS::Region}","stat":"Sum","period":3600,
            "metrics":[["AWS/States","ExecutionsSucceeded","StateMachineArn","${BackfillStateMachine}"],[".","ExecutionsFailed",".","."],
                       ["AWS/States","ExecutionsSucceeded","StateMachineArn","${WatchStateMachine}"],[".","ExecutionsFailed",".","."]]}},
          {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Detections and alerts","region":"${AWS::Region}","stat":"Sum","period":3600,
            "metrics":[["Smoulder","NewDetections"],["Smoulder","AlertsSent"],["AWS/SNS","NumberOfNotificationsDelivered","TopicName","${AlertTopic.TopicName}"]]}},
          {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Time to alert (s)","region":"${AWS::Region}","stat":"Maximum","period":3600,
            "metrics":[["Smoulder","SeenToAlertSeconds"],["Smoulder","AcquisitionToAlertSeconds"]]}},
          {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"Errors","region":"${AWS::Region}","stat":"Sum","period":300,
            "metrics":[["AWS/Lambda","Errors","FunctionName","${PipelineFunction}"],["AWS/Lambda","Errors","FunctionName","${ApiFunction}"],["AWS/ApiGateway","5xx","ApiId","${HttpApi}"]]}}
        ]}

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget: { BudgetName: smoulder-monthly, BudgetType: COST, TimeUnit: MONTHLY, BudgetLimit: { Amount: 5, Unit: USD } }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

Outputs:
  ApiUrl: { Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com" }
  DataBucketName: { Value: !Ref DataBucket }
  AlertTopicArn: { Value: !Ref AlertTopic }
  BackfillStateMachineArn: { Value: !Ref BackfillStateMachine }
  WatchStateMachineArn: { Value: !Ref WatchStateMachine }
  OpsTopicArn: { Value: !Ref OpsTopic }
